name: Mise à jour du profil

on:
  schedule:
    - cron: "17 5 * * *"   # chaque jour vers 5 h (heure de Dakar)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Générer profile.svg
        run: python3 scripts/generate.py
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
          GH_LOGIN: ${{ github.repository_owner }}
      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.svg
          git diff --staged --quiet || (git commit -m "chore: mise à jour du profil" && git push)
